name: Deploy to Production

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build frontend assets (Vite / Tailwind)
        run: |
          pnpm install --frozen-lockfile
          pnpm run build

      - name: Deploy app & pull code on server
        uses: appleboy/ssh-action@v1.0.3
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: GH_TOKEN,GEMINI_API_KEY,DB_PASSWORD
          script: |
            set -e

            cd /var/www/zaynsbeauty.co.ke

            echo "── git pull"
            git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/kimutaiRop/zeynsbeauty.git"
            git fetch origin
            git reset --hard origin/main
            git remote set-url origin "https://github.com/kimutaiRop/zeynsbeauty.git"

            echo "── update .env secrets"
            sed -i "s|^GEMINI_API_KEY=.*|GEMINI_API_KEY=${GEMINI_API_KEY}|" .env
            sed -i "s|^DB_PASSWORD=.*|DB_PASSWORD=${DB_PASSWORD}|" .env
            sed -i 's|^DB_CONNECTION=.*|DB_CONNECTION=pgsql|' .env
            sed -i 's|^DB_PORT=.*|DB_PORT=5432|' .env

            echo "── composer install"
            sudo -u app_zayns composer install --no-dev --optimize-autoloader --no-interaction

            echo "── migrate"
            sudo -u app_zayns php artisan migrate --force

      - name: Copy built assets to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "public/build"
          target: "/var/www/zaynsbeauty.co.ke/public"
          strip_components: 1

      - name: Finalize cache & reload PHP
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd /var/www/zaynsbeauty.co.ke

            echo "── optimize"
            sudo -u app_zayns php artisan optimize:clear
            sudo -u app_zayns php artisan view:clear

            echo "── generate missing embeddings"
            sudo -u app_zayns php artisan embeddings:generate --missing || true

            echo "── reload php"
            sudo systemctl reload php8.4-fpm

            echo "✓ Deploy complete"
